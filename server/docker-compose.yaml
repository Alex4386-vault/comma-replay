services:
  server:
    image: ghcr.io/alex4386-vault/comma-replay-server:latest
    env_file:
      - path: .env
        required: false
    ports:
      - "${REPLAY_PORT:-8080}:8080"
    environment:
      # Fixed inside the container; host path comes from REPLAY_DATA_HOST via volume.
      REPLAY_ADDR: ":8080"
      REPLAY_DATA_ROOT: /data
      # Overridable from .env / shell (Compose substitutes ${} from .env automatically).
      REPLAY_FRONTEND_ORIGIN: ${REPLAY_FRONTEND_ORIGIN:-http://localhost:5173}
      REPLAY_ALLOWED_USER_IDS: ${REPLAY_ALLOWED_USER_IDS:-}
    volumes:
      - ${REPLAY_DATA_HOST:-./data}:/data:ro
    restart: unless-stopped
